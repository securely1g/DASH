name: Bazel DASH

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bazel-dash-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native source and TARs (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AMD64
            architecture: amd64
            machine: x86_64
            platform: x86_64_trixie
            runner: ubuntu-24.04
          - name: ARM64
            architecture: arm64
            machine: aarch64
            platform: aarch64_trixie
            runner: ubuntu-24.04-arm
    container: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
    defaults:
      run:
        shell: bash
    steps:
      - name: Install runner and artifact inspection tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3 binutils gdb build-essential unzip zstd

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
          disk-cache: dash-${{ matrix.architecture }}
          cache-version: "8.5.1"

      - name: Record native execution and reviewed draft prerequisites
        run: |
          test "$(uname -m)" = "${{ matrix.machine }}"
          test "$(dpkg --print-architecture)" = "${{ matrix.architecture }}"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-commit.txt
          uname -a > artifacts/runner.txt
          dpkg --print-architecture >> artifacts/runner.txt
          test ! -e MODULE.bazel.lock
          test -z "$(git ls-files -- MODULE.bazel.lock)"
          git check-ignore MODULE.bazel.lock
          # Draft-only integration of the separate producer/infra registry PRs.
          # Freeze one checkout for the whole run; replace the main endpoint.
          git init "$RUNNER_TEMP/p4-registry"
          git -C "$RUNNER_TEMP/p4-registry" remote add origin \
            https://github.com/securely1g/sonic-bazel-registry.git
          git -C "$RUNNER_TEMP/p4-registry" fetch --depth=1 origin \
            98a69f50268954152b8e87c26ea70cde54ef7136
          git -C "$RUNNER_TEMP/p4-registry" checkout --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/p4-registry" rev-parse HEAD > artifacts/registry-commit.txt
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path('.bazelrc')
          previous = 'https://raw.githubusercontent.com/securely1g/sonic-bazel-registry/main'
          content = p.read_text()
          assert content.count(previous) == 1
          p.write_text(content.replace(previous, Path(os.environ['RUNNER_TEMP'], 'p4-registry').as_uri()))
          PY

      - name: Build and exercise the source-produced runtime and symbols
        run: |
          flags=(--platforms=@sonic_build_infra//platforms:${{ matrix.platform }} --host_platform=@sonic_build_infra//platforms:${{ matrix.platform }} --jobs=4)
          bazel test "${flags[@]}" //bazel:runtime_test \
            --build_event_json_file=artifacts/build-events.json 2>&1 | tee artifacts/build.log
          bazel build "${flags[@]}" //:runtime //:runtime.debug_symbols //:sdk
          cp "$(bazel cquery "${flags[@]}" //:runtime --output=files)" artifacts/runtime.tar
          cp "$(bazel cquery "${flags[@]}" //:runtime.debug_symbols --output=files)" artifacts/debug.tar
          sha256sum artifacts/runtime.tar artifacts/debug.tar > artifacts/SHA256SUMS
          cp MODULE.bazel.lock artifacts/generated-MODULE.bazel.lock
          git restore .bazelrc
          git diff --exit-code

      - name: Upload TARs and source validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dash-bazel-${{ matrix.architecture }}
          path: |
            artifacts/
            bazel-testlogs/bazel/runtime_test/test.log
            bazel-testlogs/bazel/runtime_test/test.xml
          if-no-files-found: error
